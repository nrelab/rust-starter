name: Find Rust Changes
description: Detect whether Rust/Cargo/toolchain/CI files changed in a pull request
inputs:
  base:
    description: Base branch name
    required: true
  head:
    description: Head commit SHA or branch
    required: true
outputs:
  rust_changed:
    description: Whether relevant files changed
    value: ${{ steps.diff.outputs.rust_changed }}
  changed_files:
    description: Newline-separated changed file list
    value: ${{ steps.diff.outputs.changed_files }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$BASE"
        files="$(git diff --name-only "origin/$BASE...$HEAD" || git diff --name-only "origin/$BASE" "$HEAD")"
        printf '%s\n' "$files"
        if printf '%s\n' "$files" | grep -Eq '(^|/)(Cargo\.toml|Cargo\.lock|build\.rs|rust-toolchain(\.toml)?|rustfmt\.toml)$|^\.cargo/|\.rs$|^\.github/(actions|workflows)/|^scripts/'; then
          echo "rust_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "rust_changed=false" >> "$GITHUB_OUTPUT"
        fi
        {
          echo "changed_files<<EOF"
          printf '%s\n' "$files"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
