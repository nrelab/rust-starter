name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/setup-rust
      - run: bash scripts/check.sh
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          [[ "$version" == "$tag" ]] || { echo "Tag $tag does not match Cargo version $version" >&2; exit 1; }

# This workflow verifies release candidates only. Publishing and GitHub Release creation
# are intentionally omitted until the project configures a protected environment and secrets.
